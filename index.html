<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a14"><title>A mi ritmo — ¿Para qué tomarte el trabajo?</title><link rel="stylesheet" href="./src/styles.css"><link rel="icon" href="data:,"></head><body>
<canvas id="scene" aria-hidden="true"></canvas>
<header><div class="brand">a mi ritmo<span> ·</span></div><nav aria-label="Preferencias"><button id="sound" aria-pressed="false">Sonido off</button><button id="pause" aria-pressed="false">Pausar</button></nav></header>

<main class="bars">
<section class="bar automatic" aria-label="Barra automática">
<div id="auto-scene" class="scene" role="img" aria-label="Una máquina llena vasos y los entrega sin detenerse"></div>
<button class="receive" id="collect">Obtener bebida automática <span aria-hidden="true">↗</span></button></section>
<section class="bar manual" aria-label="Prepara tu bebida">
<div id="manual-scene" class="scene" role="img" aria-label="Tu vaso comienza vacío y recibe los ingredientes que arrastres"></div>
<div class="tray" aria-label="Herramientas para crear tu cóctel">
<div class="tool-slot"><div class="tool" tabindex="0" role="button" aria-label="Botella de licor. Arrastra al vaso para verter; con teclado pulsa Enter." data-tool="spirit"><svg viewBox="0 0 60 100" aria-hidden="true"><path d="M24 5h12v25l12 13v48q-18 7-36 0V43l12-13Z" fill="#648cab88" stroke="#b5deed"/><path d="M15 53h30v30H15Z" fill="#d4c7ac"/><text x="30" y="67" text-anchor="middle" fill="#333346" font-size="7">SPIRIT</text><text x="30" y="77" text-anchor="middle" fill="#333346" font-size="5">40% VOL.</text><path d="M23 4h14v10H23Z" fill="#d4c7ac"/><path d="M18 44v43" stroke="#e8f7ff88"/></svg><span class="tool-label">Licor</span></div></div>
<div class="tool-slot"><div class="tool" tabindex="0" role="button" aria-label="Botella de limón. Arrastra al vaso o pulsa Enter." data-tool="citrus"><svg viewBox="0 0 60 100" aria-hidden="true"><path d="M25 16h10v19q13 9 13 20v35q-18 8-36 0V55q0-11 13-20Z" fill="#c3cb6688" stroke="#e6e9ad"/><path d="M23 10h14v12H23Z" fill="#bac387"/><circle cx="30" cy="65" r="13" fill="#e0df9e"/><path d="m21 65 18 0m-9-9v18m-7-16 14 14m-14 0 14-14" stroke="#999d50"/><path d="M17 48v36" stroke="#ffffff66"/></svg><span class="tool-label">Limón</span></div></div>
<div class="tool-slot"><div class="tool" tabindex="0" role="button" aria-label="Botella de granadina. Arrastra al vaso o pulsa Enter." data-tool="syrup"><svg viewBox="0 0 60 100" aria-hidden="true"><path d="M25 13h10v26l10 9v44H15V48l10-9Z" fill="#c44a7988" stroke="#eda6bb"/><path d="M23 8h14v12H23Z" fill="#d9b4a4"/><path d="M18 58h24v25H18Z" fill="#e9bcb1"/><text x="30" y="68" text-anchor="middle" fill="#763b4d" font-size="6">GRENADINE</text><path d="M25 74h10" stroke="#763b4d"/></svg><span class="tool-label">Granadina</span></div></div>
<div class="tool-slot"><div class="tool" tabindex="0" role="button" aria-label="Sifón de agua con gas. Arrastra al vaso o pulsa Enter." data-tool="soda"><svg viewBox="0 0 60 100" aria-hidden="true"><path d="M23 27h14l9 21v42q-16 8-32 0V48Z" fill="#479b9988" stroke="#a6e3d6"/><path d="M23 12h15v22H23Z" fill="#b6c9c6"/><path d="M28 12H47v7H32M37 21l8 13" fill="none" stroke="#b6c9c6" stroke-width="5"/><circle cx="26" cy="65" r="4" fill="none" stroke="#cdf8eb"/><circle cx="35" cy="54" r="2" fill="none" stroke="#cdf8eb"/><text x="30" y="83" text-anchor="middle" fill="#e7fff3" font-size="7">SODA</text></svg><span class="tool-label">Agua con gas</span></div></div>
<div class="tool-slot"><div class="tool" tabindex="0" role="button" aria-label="Pala de hielo. Arrastra al vaso para añadir un cubo o pulsa Enter." data-tool="ice"><svg viewBox="0 0 60 100" aria-hidden="true"><path d="M27 8h7v42h-7Z" fill="#9caeba"/><path d="M14 43q16-9 32 0v38q-16 19-32 0Z" fill="#68889988" stroke="#d3e4ee"/><rect x="17" y="49" width="18" height="20" rx="4" fill="#c2edff99" stroke="#e5f8ff" transform="rotate(-12 26 59)"/><rect x="28" y="64" width="16" height="18" rx="4" fill="#c2edff99" stroke="#e5f8ff"/></svg><span class="tool-label">Hielo</span></div></div>
<div class="tool-slot"><div class="tool" tabindex="0" role="button" aria-label="Cuchara. Arrastra y mueve dentro del vaso para mezclar, o pulsa Enter varias veces." data-tool="spoon"><svg viewBox="0 0 60 100" aria-hidden="true"><path d="M30 6v65" stroke="#cdb6a0" stroke-width="4"/><path d="m27 15 6 7-6 7 6 7-6 7 6 7-6 7" stroke="#f2e5d4" fill="none" stroke-width="1.5"/><ellipse cx="30" cy="80" rx="9" ry="14" fill="#bfa993" stroke="#f1ddbf"/></svg><span class="tool-label">Mezclar</span></div></div>
</div><div class="manual-actions"><button id="empty" aria-label="Vaciar vaso" title="Vaciar vaso">↶</button><button id="serve" disabled>Servir ↗</button></div></section>
</main><div id="status" role="status" aria-live="polite"></div><script type="module" src="./src/main.js"></script>
</body></html>
